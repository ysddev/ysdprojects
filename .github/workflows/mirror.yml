name: mirror
on:
  workflow_dispatch:
  push:
    paths: ['tools/mirror.py', 'tools/404.html', 'home/**', '.github/workflows/mirror.yml', 'clients/**', 'works/**']
permissions:
  contents: write
concurrency: { group: mirror, cancel-in-progress: false }
jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Copy works from Cloudflare
        run: python3 tools/mirror.py site
      - name: Client photos to webp on our domain (clients/*/ и works/*/images.txt)
        run: |
          # строка: имя unsplash-id ширина высота w1,w2 → clients/<slug>/img/<имя>-<w>.webp (быстро и из РФ, без внешних CDN)
          for f in clients/*/images.txt works/*/images.txt works/*/*/images.txt; do
            [ -f "$f" ] || continue; d="$(dirname "$f")/img"; mkdir -p "$d"
            grep -v '^#' "$f" | while read -r name id a b widths; do
              [ -n "$name" ] || continue
              for w in $(echo "$widths" | tr , ' '); do
                h=$((w*b/a))
                curl -fsSL --retry 3 "https://images.unsplash.com/photo-$id?fm=webp&q=80&fit=crop&w=$w&h=$h" -o "$d/$name-$w.webp" || echo "::warning::нет фото $name $w"
              done
            done
          done
      - name: Add new works (hosted only here)
        run: |
          for d in works/*/; do [ -n "$(find "$d" -name index.html -print -quit)" ] && mkdir -p "site/$(basename $d)" && cp -R "$d". "site/$(basename $d)/"; done; true  # и вложенные: works/bots/food/
      - name: Add temporary client sites
        run: |
          if [ -d clients ]; then mkdir -p site/clients && cp -R clients/. site/clients/; fi
      - name: Publish to gh-pages branch
        run: |
          cd site
          echo "ysdprojects.space" > CNAME
          touch .nojekyll
          cp -R ../home/. . && rm -f works.json ysdmk-symbol.svg  # главная: витрина живых проектов (tools/build_home.py)
          # свежие обложки работ из ветки thumbs (снимок живой страницы) поверх карточек витрины
          if git -C .. fetch -q --depth 1 origin thumbs 2>/dev/null; then
            mkdir -p ../_thumbs && git -C .. archive FETCH_HEAD | tar -x -C ../_thumbs
            python3 - <<'PY'
          import json, os, shutil
          works = json.load(open('../home/works.json', encoding='utf-8'))
          for w in works:
              slug = w['u'].rstrip('/').split('/')[-1]
              for size in (400, 800):
                  src = f'../_thumbs/{slug}-{size}.webp'
                  if os.path.exists(src):
                      shutil.copy(src, f"img/{w['f']}-{size}.webp")
          PY
          fi
          cp ../tools/404.html 404.html
          mkdir -p d && cp ../tools/404.html d/index.html  # демо клиентов: /d/<проект>/ — с сервера бота
          printf 'User-agent: *\nDisallow: /d/\nDisallow: /clients/\nSitemap: https://ysdprojects.space/sitemap.xml\n' > robots.txt
          printf '<?xml version="1.0" encoding="UTF-8"?><urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9"><url><loc>https://ysdprojects.space/</loc></url></urlset>' > sitemap.xml
          git init -q -b gh-pages
          git config user.name "ysd-mirror"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -q -m "Зеркало работ портфолио $(date -u +%F)"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
