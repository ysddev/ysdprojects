<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Архив коллекций</title>
<meta name="description" content="Каталог образцов: эскизы, палитры фабрик, документы. Демо на трёх товарах.">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#F3F1EC">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Архив">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F3F1EC; --card:#FFFFFF; --well:#E9E6DF; --ink:#18171B; --ink2:#55535C; --ink3:#86848C;
  --line:#DDD9D1; --accent:#5E4F6E; --accent-soft:#ECE7F1; --warn:#8A5A12; --warn-soft:#F6EEDC;
  --r:14px; --ease:cubic-bezier(.23,1,.32,1);
  --sans:"Onest",system-ui,-apple-system,"Segoe UI",sans-serif; --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  color-scheme:light;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--paper);color:var(--ink);font:400 15px/1.45 var(--sans);min-height:100dvh;-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
img{display:block;max-width:100%}
.mono{font-family:var(--mono);letter-spacing:-.01em}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- login ---------- */
#gate{min-height:100dvh;display:grid;place-items:center;padding:24px 16px}
.gate-box{width:100%;max-width:360px}
.mark{width:52px;height:52px;border-radius:14px;background:var(--ink);color:var(--paper);display:grid;place-items:center;font:700 22px var(--sans);margin-bottom:28px}
.gate-box h1{font:600 28px/1.15 var(--sans);letter-spacing:-.02em}
.gate-box p{color:var(--ink2);margin:10px 0 28px}
.field{display:block;font-size:13px;color:var(--ink2);margin-bottom:8px}
.inp{width:100%;height:50px;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:0 16px;font-size:16px;transition:border-color .2s}
.inp:focus{outline:none;border-color:var(--ink)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:48px;padding:0 20px;border-radius:12px;background:var(--ink);color:var(--paper);font-weight:600;transition:transform .16s var(--ease),opacity .2s}
.btn:active{transform:scale(.97)}
.btn.full{width:100%;margin-top:12px;height:50px}
.err{color:#A3302A;font-size:13px;min-height:20px;margin-top:8px}
.hint{font-size:13px;color:var(--ink3);margin-top:18px}
.shake{animation:shake .4s var(--ease)}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}

/* ---------- app shell ---------- */
#app{display:none}
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--paper) 88%,transparent);backdrop-filter:saturate(1.4) blur(14px);-webkit-backdrop-filter:saturate(1.4) blur(14px);border-bottom:1px solid transparent;transition:border-color .2s;padding-top:env(safe-area-inset-top)}
.top.scrolled{border-color:var(--line)}
.wrap{max-width:1240px;margin:0 auto;padding:0 16px}
.bar{display:flex;align-items:center;gap:14px;height:64px}
.brand{display:flex;align-items:center;gap:10px;font-weight:600;font-size:17px;letter-spacing:-.01em;white-space:nowrap}
.brand .mark{width:34px;height:34px;border-radius:10px;font-size:13px;margin:0}
.tabs{display:flex;background:var(--well);border-radius:11px;padding:3px;margin-left:auto}
.tab{height:36px;padding:0 14px;border-radius:9px;font-weight:500;font-size:14px;color:var(--ink2);display:flex;align-items:center;gap:7px;transition:background .2s,color .2s}
.tab[aria-selected=true]{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.06)}
.tab .n{font:500 11px var(--mono);color:var(--ink3)}
.search{position:relative;flex:1;max-width:340px}
.search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--ink3)}
.search input{width:100%;height:42px;border-radius:11px;border:1px solid var(--line);background:var(--card);padding:0 14px 0 38px;font-size:15px}
.search input:focus{outline:none;border-color:var(--ink)}
.lock{width:42px;height:42px;border-radius:11px;display:grid;place-items:center;color:var(--ink2)}
@media (hover:hover) and (pointer:fine){.lock:hover{background:var(--well)}}

.filters{display:flex;gap:8px;overflow-x:auto;padding:4px 0 14px;scrollbar-width:none;-webkit-mask-image:linear-gradient(90deg,#000 92%,transparent)}
.filters::-webkit-scrollbar{display:none}
.fgroup{display:flex;gap:6px;align-items:center;flex-shrink:0;padding-right:10px;margin-right:4px;border-right:1px solid var(--line)}
.fgroup:last-child{border:0}
.flabel{font-size:12px;color:var(--ink3);margin-right:2px;white-space:nowrap}
.chip{height:36px;padding:0 13px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-size:14px;white-space:nowrap;display:flex;align-items:center;gap:7px;transition:background .2s,border-color .2s,color .2s,transform .16s var(--ease)}
.chip:active{transform:scale(.96)}
.chip[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.dot{width:14px;height:14px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.14);flex-shrink:0}
.reset{font-size:14px;color:var(--accent);font-weight:500;height:36px;padding:0 8px;white-space:nowrap}

.meta{display:flex;justify-content:space-between;align-items:baseline;padding:18px 0 14px;gap:12px}
.meta h2{font:600 24px/1.1 var(--sans);letter-spacing:-.02em}
.meta span{font-size:13px;color:var(--ink3)}

/* ---------- grid ---------- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px;padding-bottom:40px}
.card{background:var(--card);border-radius:var(--r);overflow:hidden;text-align:left;display:flex;flex-direction:column;border:1px solid var(--line);transition:transform .35s var(--ease),box-shadow .35s var(--ease),opacity .4s var(--ease);opacity:0;transform:translateY(10px)}
.card.in{opacity:1;transform:none}
@media (hover:hover) and (pointer:fine){.card:hover{transform:translateY(-3px);box-shadow:0 14px 30px -18px rgba(24,23,27,.35)}}
.card:active{transform:scale(.985)}
.thumb{aspect-ratio:5/6;background:var(--well);position:relative;overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover;object-position:center 8%}
.badge{position:absolute;left:10px;top:10px;font:500 12px var(--mono);background:rgba(255,255,255,.92);padding:4px 8px;border-radius:7px}
.cbody{padding:13px 14px 15px;display:flex;flex-direction:column;gap:6px;flex:1}
.cat{font-size:12px;color:var(--ink3);text-transform:uppercase;letter-spacing:.06em;font-weight:500}
.cname{font-weight:600;font-size:15.5px;line-height:1.3;letter-spacing:-.01em}
.crow{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:auto;padding-top:8px}
.cinfo{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--ink2);min-width:0}
.cinfo .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.price{font:500 14px var(--mono);white-space:nowrap}
.empty{grid-column:1/-1;text-align:center;padding:60px 16px;color:var(--ink2)}

/* palettes grid */
.pcard .thumb{aspect-ratio:4/3}
.pcard .thumb img{object-position:center 30%}
.pstrip{display:flex;gap:4px;position:absolute;right:10px;bottom:10px}
.pstrip i{width:22px;height:22px;border-radius:6px;background-size:cover;background-position:center;box-shadow:0 0 0 2px #fff}

/* ---------- detail sheet ---------- */
.scrim{position:fixed;inset:0;background:rgba(20,19,23,.42);z-index:40;opacity:0;pointer-events:none;transition:opacity .3s var(--ease)}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;z-index:41;background:var(--paper);display:flex;flex-direction:column;overflow:hidden;transition:transform .45s var(--ease),opacity .3s var(--ease)}
@media (min-width:860px){
  .sheet{inset:4vh auto 4vh 50%;width:min(1080px,94vw);border-radius:20px;transform:translate(-50%,24px);opacity:0;pointer-events:none}
  .sheet.on{transform:translate(-50%,0);opacity:1;pointer-events:auto}
  .sbody{display:grid;grid-template-columns:1.05fr 1fr;height:100%;overflow:hidden}
  .simg{height:100%}
  .sinfo{overflow-y:auto}
}
@media (max-width:859.98px){
  .sheet{inset:auto 0 0 0;height:94dvh;border-radius:20px 20px 0 0;transform:translateY(102%)}
  .sheet.on{transform:none}
  .sbody{overflow-y:auto;height:100%}
  .simg{height:56dvh}
}
.grab{position:absolute;left:50%;top:8px;width:40px;height:5px;border-radius:3px;background:rgba(0,0,0,.18);transform:translateX(-50%);z-index:3}
@media (min-width:860px){.grab{display:none}}
.close{position:absolute;right:14px;top:14px;z-index:4;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.94);display:grid;place-items:center;box-shadow:0 2px 10px rgba(0,0,0,.1);transition:transform .16s var(--ease)}
.close:active{transform:scale(.92)}
.simg{background:#ECEBE8;position:relative;cursor:zoom-in;overflow:hidden}
.simg img{width:100%;height:100%;object-fit:contain}
.zoomhint{position:absolute;left:14px;bottom:14px;display:flex;align-items:center;gap:6px;font-size:12.5px;background:rgba(255,255,255,.92);padding:7px 11px;border-radius:999px;color:var(--ink2);pointer-events:none}
.sinfo{padding:28px 26px 40px;display:flex;flex-direction:column;gap:22px}
@media (max-width:520px){.sinfo{padding:22px 16px calc(32px + env(safe-area-inset-bottom))}}
.shead .art{font:500 13px var(--mono);color:var(--ink3);display:flex;align-items:center;gap:8px}
.copy{font:500 12px var(--sans);color:var(--accent);padding:4px 8px;border-radius:6px;min-height:28px}
@media (hover:hover) and (pointer:fine){.copy:hover{background:var(--accent-soft)}}
.shead h3{font:600 26px/1.15 var(--sans);letter-spacing:-.02em;margin:6px 0 10px;text-wrap:balance}
.pricebig{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.pricebig b{font:500 22px var(--mono)}
.tag{font-size:12px;padding:4px 9px;border-radius:999px;background:var(--warn-soft);color:var(--warn);font-weight:500}
.sizes{display:flex;gap:6px;flex-wrap:wrap}
.size{min-width:44px;height:36px;padding:0 10px;border-radius:9px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;font:500 13px var(--mono)}
.block h4{font-size:12px;color:var(--ink3);text-transform:uppercase;letter-spacing:.07em;font-weight:500;margin-bottom:10px}
.dl{display:grid;grid-template-columns:132px 1fr;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.dl dt,.dl dd{padding:11px 14px;border-top:1px solid var(--line);font-size:14px}
.dl dt{color:var(--ink2)}
.dl dt:first-of-type,.dl dt:first-of-type+dd{border-top:0}
.dl dd{word-break:break-word}
@media (max-width:420px){.dl{grid-template-columns:1fr}.dl dd{border-top:0;padding-top:0}.dl dt{padding-bottom:4px}}
.colorline{display:flex;align-items:center;gap:8px}
.colorline .dot{width:18px;height:18px}
.palbtn{display:flex;align-items:center;gap:14px;width:100%;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:left;transition:border-color .2s,transform .16s var(--ease)}
.palbtn:active{transform:scale(.985)}
@media (hover:hover) and (pointer:fine){.palbtn:hover{border-color:var(--ink)}}
.palbtn img{width:64px;height:64px;border-radius:9px;object-fit:cover}
.palbtn b{display:block;font-weight:600}
.palbtn small{color:var(--ink2);font-size:13px}
.palbtn .go{margin-left:auto;color:var(--ink3)}
.note{background:var(--accent-soft);border-radius:12px;padding:13px 15px;font-size:14px;color:#3D3349}
.files{display:flex;flex-direction:column;gap:8px}
.file{display:flex;align-items:center;gap:12px;background:var(--card);border:1px dashed var(--line);border-radius:12px;padding:11px 13px;font-size:14px}
.file .ic{width:36px;height:36px;border-radius:9px;background:var(--well);display:grid;place-items:center;font:600 10px var(--mono);color:var(--ink2);flex-shrink:0}
.file small{display:block;color:var(--ink3);font-size:12.5px}
.warnline{font-size:13px;color:var(--warn);display:flex;gap:6px;align-items:flex-start}

.ccolor{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--ink2);min-width:0}
.ccolor .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ccolor .mono{color:var(--ink3);font-size:12px;white-space:nowrap}
.hcolor{margin:-2px 0 12px;font-size:15px;color:var(--ink2)}
.hcolor .dot{width:16px;height:16px}
.stable{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow-x:auto}
.stable table{width:100%;border-collapse:collapse;font-size:14px;min-width:420px}
.stable th{font-weight:500;color:var(--ink2);font-size:12.5px;text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
.stable td{padding:10px 12px;border-top:1px solid var(--line);color:var(--ink3)}
.stable tr:first-child td{border-top:0}
.stable td.mono{color:var(--ink)}
.comments{display:flex;flex-direction:column;gap:8px;margin-bottom:10px}
.cmt{background:var(--accent-soft);border-radius:12px;padding:11px 14px}
.cmt.fresh{animation:pop .45s var(--ease)}
@keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.cmeta{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;color:#5B5168;margin-bottom:3px}
.cmeta b{font-weight:600;color:#3D3349}
.ctext{font-size:14px;color:#2F2838;white-space:pre-wrap;word-break:break-word}
.cform{display:flex;flex-direction:column;gap:8px}
.cform .inp{height:44px}
.cform textarea.inp{height:auto;min-height:84px;padding:12px 16px;resize:vertical;line-height:1.4}
.cform .btn{align-self:flex-start}
/* ---------- viewer ---------- */
.viewer{position:fixed;inset:0;z-index:60;background:#0E0E10;display:flex;flex-direction:column;opacity:0;pointer-events:none;transition:opacity .25s var(--ease)}
.viewer.on{opacity:1;pointer-events:auto}
.vtop{display:flex;align-items:center;gap:12px;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;color:#fff}
.vtop .vt{font-weight:600;font-size:15px}
.vtop .vs{font-size:12.5px;color:#A8A6AE}
.vbtn{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:#fff;background:rgba(255,255,255,.08);flex-shrink:0;transition:transform .16s var(--ease),background .2s}
.vbtn:active{transform:scale(.92)}
@media (hover:hover) and (pointer:fine){.vbtn:hover{background:rgba(255,255,255,.16)}}
.vstage{flex:1;position:relative;overflow:hidden;touch-action:none;cursor:grab}
.vstage.zoomed{cursor:move}
.vstage img{position:absolute;inset:0;margin:auto;max-width:100%;max-height:100%;width:auto;height:auto;user-select:none;-webkit-user-drag:none;transform-origin:center center;will-change:transform}
.vstage img.anim{transition:transform .32s var(--ease)}
.vnav{position:absolute;top:50%;transform:translateY(-50%);z-index:2}
.vnav.l{left:12px}.vnav.r{right:12px}
@media (max-width:640px){.vnav{display:none}}
.vthumbs{display:flex;gap:8px;justify-content:center;padding:10px 14px calc(14px + env(safe-area-inset-bottom));overflow-x:auto}
.vthumbs button{width:52px;height:52px;border-radius:9px;overflow:hidden;opacity:.45;flex-shrink:0;box-shadow:0 0 0 2px transparent;transition:opacity .2s,box-shadow .2s}
.vthumbs button[aria-current=true]{opacity:1;box-shadow:0 0 0 2px #fff}
.vthumbs img{width:100%;height:100%;object-fit:cover}
.vzoom{position:absolute;right:14px;bottom:14px;font:500 12px var(--mono);color:#fff;background:rgba(255,255,255,.1);padding:5px 9px;border-radius:7px;pointer-events:none}

.foot{border-top:1px solid var(--line);padding:22px 0 calc(28px + env(safe-area-inset-bottom));color:var(--ink3);font-size:13px;display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap}

@media (max-width:720px){
  .bar{flex-wrap:wrap;height:auto;padding:10px 0 8px;row-gap:10px}
  .search{order:3;max-width:none;flex-basis:100%}
  .brand span{display:none}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .cbody{padding:10px 11px 12px}
  .cname{font-size:14px}
  .cinfo .t{display:none}
  .meta h2{font-size:21px}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition-duration:.01ms!important;animation:none!important}.card{opacity:1;transform:none}}
</style>
</head>
<body>

<section id="gate" aria-label="Вход">
  <form class="gate-box" id="gateForm" autocomplete="off">
    <div class="mark" aria-hidden="true">BT</div>
    <h1>Архив коллекций</h1>
    <p>Эскизы, палитры фабрик и документы по каждому артикулу. Доступ только для сотрудников.</p>
    <label class="field" for="pw">Пароль</label>
    <input class="inp" id="pw" type="password" inputmode="text" autocomplete="current-password" required>
    <div class="err" id="err" role="alert"></div>
    <button class="btn full" type="submit">Войти</button>
    <div class="hint">Демо-доступ: пароль <b class="mono">2026</b></div>
  </form>
</section>

<div id="app">
  <header class="top" id="top">
    <div class="wrap">
      <div class="bar">
        <div class="brand"><div class="mark" aria-hidden="true">BT</div><span>Архив коллекций</span></div>
        <div class="search" role="search">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <label class="sr" for="q">Поиск</label>
          <input id="q" type="search" placeholder="Артикул, название, состав, декларация" enterkeyhint="search">
        </div>
        <div class="tabs" role="tablist" aria-label="Раздел">
          <button class="tab" role="tab" aria-selected="true" data-tab="items">Товары <span class="n" id="nItems"></span></button>
          <button class="tab" role="tab" aria-selected="false" data-tab="pals">Палитры <span class="n" id="nPals"></span></button>
        </div>
        <button class="lock" id="logout" aria-label="Выйти" title="Выйти">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2.5"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
        </button>
      </div>
      <div class="filters" id="filters" aria-label="Фильтры"></div>
    </div>
  </header>

  <main class="wrap">
    <div class="meta"><h2 id="title">Товары</h2><span id="count"></span></div>
    <div class="grid" id="grid"></div>
    <footer class="foot">
      <span>Демо-версия на трёх товарах из вашего шаблона Excel. Полный каталог загружается тем же файлом.</span>
      <span>Демо YSD DEV</span>
    </footer>
  </main>
</div>

<div class="scrim" id="scrim"></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sTitle"></section>

<section class="viewer" id="viewer" role="dialog" aria-modal="true" aria-label="Просмотр изображения">
  <div class="vtop">
    <button class="vbtn" id="vClose" aria-label="Закрыть"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
    <div><div class="vt" id="vTitle"></div><div class="vs" id="vSub"></div></div>
  </div>
  <div class="vstage" id="vStage">
    <img id="vImg" alt="" draggable="false">
    <button class="vbtn vnav l" id="vPrev" aria-label="Предыдущее"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="m15 18-6-6 6-6"/></svg></button>
    <button class="vbtn vnav r" id="vNext" aria-label="Следующее"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="m9 18 6-6-6-6"/></svg></button>

stage.addEventListener("pointermove",function(e){
  if(!ptrs[e.pointerId])return;ptrs[e.pointerId]={x:e.clientX,y:e.clientY};var ids=Object.keys(ptrs);
  if(pinch&&ids.length===2){var a=ptrs[ids[0]],b=ptrs[ids[1]];zoomAt(pinch.s*Math.hypot(a.x-b.x,a.y-b.y)/pinch.d,(a.x+b.x)/2,(a.y+b.y)/2,false)}
  else if(pan&&s>1.01){tx=pan.tx+e.clientX-pan.x;ty=pan.ty+e.clientY-pan.y;clamp();apply(false)}
});
function up(e){
  if(swipeX!==null&&Object.keys(ptrs).length===1&&vset&&vset.imgs.length>1){var dx=e.clientX-swipeX;if(Math.abs(dx)>60)show(vi+(dx<0?1:-1))}
  delete ptrs[e.pointerId];if(Object.keys(ptrs).length<2)pinch=null;if(!Object.keys(ptrs).length){pan=null;swipeX=null}
}
stage.addEventListener("pointerup",up);stage.addEventListener("pointercancel",up);
stage.addEventListener("wheel",function(e){e.preventDefault();zoomAt(s*(e.deltaY<0?1.15:1/1.15),e.clientX,e.clientY,false)},{passive:false});
document.addEventListener("keydown",function(e){
  if(V.classList.contains("on")){if(e.key==="Escape")closeViewer();if(e.key==="ArrowRight"&&vset.imgs.length>1)show(vi+1);if(e.key==="ArrowLeft"&&vset.imgs.length>1)show(vi-1);return}
  if(e.key==="Escape"&&sheet.classList.contains("on"))closeItem();
});
})();
</script>
