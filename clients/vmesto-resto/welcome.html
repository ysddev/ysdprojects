<!DOCTYPE html>
<html lang="ru"><head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1,viewport-fit=cover" name="viewport"/>
<meta content="noindex,nofollow" name="robots"/>
<meta content="same-origin" name="referrer"/>
<meta content="#f7f7ef" name="theme-color"/>
<title>Добро пожаловать · Вместо Ресто</title>
<link href="assets/icon.svg" rel="icon" type="image/svg+xml"/>
<link as="font" crossorigin="" href="assets/fonts/manrope-cyrillic-700-normal.woff2" rel="preload" type="font/woff2"/>
<link as="font" crossorigin="" href="assets/fonts/pacifico-cyrillic-400-normal.woff2" rel="preload" type="font/woff2"/>
<link href="assets/app.css?v=d1" rel="stylesheet"/>
<script defer="" src="assets/app.js?v=d1"></script>
<script defer="" src="assets/mock.js"></script></head>
<body data-page="welcome.html">
<div class="login-shell">
<header class="login-top">
<a aria-label="Вместо Ресто — на главную" class="brand" href="index.html"><strong>Вместо Ресто</strong><small>обед по плану</small></a>
<span class="location"><svg aria-hidden="true" fill="none" height="14" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewbox="0 0 24 24" width="14"><path d="M20 10c0 4.99-5.54 10.19-7.4 11.8a1 1 0 0 1-1.2 0C9.54 20.19 4 14.99 4 10a8 8 0 0 1 16 0"></path><circle cx="12" cy="10" r="3"></circle></svg>Томск <b></b> UTC+7</span>
</header>
<main class="login-main">
<section class="login-left">
<span class="eyebrow"><i></i>Первый вход</span>
<h1>Здравствуйте<span>!</span></h1>
<p class="login-lead">Сергей, придумайте свой пароль вместо временного — дальше будете входить с ним.</p>
<form action="#" class="login-form rise stack" data-to="welcome.html" method="post" novalidate="">
 <label class="field"><span>Новый пароль</span><input autocomplete="new-password" autofocus="" name="password" required="" type="password"/><small class="hint">Не короче 8 символов и не совпадает с логином.</small></label>
<label class="field"><span>Повторите пароль</span><input autocomplete="new-password" name="password2" required="" type="password"/></label>
<label class="check"><input name="consent" required="" type="checkbox" value="1"/><span>Согласен(на) на обработку моих персональных данных (ФИО, табельный номер, почта, заказы) для доставки обедов — по <a class="text-btn" href="policy.html">политике</a>.</span></label>
<button class="btn wide split" type="submit">Продолжить <svg aria-hidden="true" fill="none" height="17" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewbox="0 0 24 24" width="17"><path d="M5 12h14"></path><path d="m12 5 7 7-7 7"></path></svg></button>
</form>
</section>
<div aria-hidden="true" class="login-visual">
<img alt="" fetchpriority="high" height="1250" src="assets/img/login.jpg" width="1000"/>
<span class="visual-tag"><svg aria-hidden="true" fill="none" height="13" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewbox="0 0 24 24" width="13"><circle cx="12" cy="12" r="10"></circle><path d="M12 6v6l4 2"></path></svg>Доставка в офис</span>
<div class="visual-caption"><span class="eyebrow">Комплексные обеды</span><p>Обеденный перерыв<br/>для вашей команды</p></div>
</div>
</main>
<footer class="login-footer">
<span>Вместо Ресто · Томск</span>
<a href="policy.html">Политика конфиденциальности</a>
</footer>
</div>
</body></html>
