<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>YSD DEV</title>
<script>
// Демо-сайты клиентов: https://ysdprojects.space/d/<проект>/ (и /d/?p=<проект>).
// Сам сайт лежит на сервере бота (app.ysddev.com/p/<проект>/) — страница подгружает его и показывает здесь,
// чтобы клиент видел адрес ysdprojects.space и сайт открывался в России (GitHub Pages, без Cloudflare).
// Всё остальное, чего нет, — на портфолио.
(function () {
  var path = location.pathname, slug = null, m = path.match(/^\/d\/([a-z0-9-]{3,80})\/?$/);
  if (m) slug = m[1];
  else if (/^\/d\/?(index\.html)?$/.test(path)) slug = new URLSearchParams(location.search).get('p');
  if (!slug || !/^[a-z0-9-]{3,80}$/.test(slug)) { location.replace('https://ysddev.com/#works'); return; }
  var src = 'https://app.ysddev.com/p/' + slug + '/';
  fetch(src, { cache: 'no-store' })
    .then(function (r) { if (!r.ok) throw new Error(String(r.status)); return r.text(); })
    .then(function (html) {
      // относительные адреса (картинки, стили) — с сервера, где лежит сайт; якоря (#контакты) — на этой же странице
      var fix = '<base href="' + src + '"><script>document.addEventListener("click",function(e){'
        + 'var a=e.target.closest&&e.target.closest(\'a[href^="#"]\');if(!a)return;e.preventDefault();'
        + 'var id=decodeURIComponent(a.getAttribute("href").slice(1)),el=id&&document.getElementById(id);'
        + 'if(el)el.scrollIntoView({behavior:"smooth"});else scrollTo({top:0,behavior:"smooth"});'
        + 'history.replaceState(null,"",location.pathname+location.search+(id?"#"+id:""))},true)<\/script>';
      html = /<head[^>]*>/i.test(html) ? html.replace(/<head([^>]*)>/i, '<head$1>' + fix) : fix + html;
      document.open(); document.write(html); document.close();
    })
    .catch(function (e) { location.replace(e && e.message === '404' ? 'https://ysddev.com/#works' : src); });
})();
</script>
</head>
<body style="margin:0;background:#0b0b0f"></body>
</html>
