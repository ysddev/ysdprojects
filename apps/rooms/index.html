:root{--bg:#f2f2ee;--side:#111111;--sink:#f2f2ee;--sline:#262626;--son:#d7ff3a;--sonk:#111111;--ink:#111111;--mut:#6e6e68;--line:#dcdcd4;--card:#ffffff;--ac:#111111;--aci:#d7ff3a;--fh:"Sofia Sans Condensed",sans-serif;--fb:"Inter Tight",sans-serif;--hw:800;--ht:-.01em;--ok:#1f9d5a;--warn:#d99100;--bad:#e0453c;--info:#3a6ff0;--idle:#9a9a92;--r:6px;--rs:6px;--csh:0 0 0 1.5px #111}

*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 14.5px/1.45 var(--fb);-webkit-font-smoothing:antialiased;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px;border-radius:6px}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
:root{--ok:#1e9e62;--warn:#d98a00;--bad:#d64045;--info:#2f6fde;--idle:#8a93a3;--r:12px;--rs:8px}
.app{display:grid;grid-template-columns:var(--sw,236px) minmax(0,1fr);height:100vh;height:100dvh}
.side{background:var(--side);color:var(--sink);display:flex;flex-direction:column;gap:2px;padding:16px 12px;border-right:1px solid var(--sline,var(--line));min-height:0;overflow-y:auto}
.org{display:flex;align-items:center;gap:10px;padding:4px 8px 18px}
.org i{width:36px;height:36px;border-radius:10px;background:var(--ac);color:var(--aci);display:grid;place-items:center;font:700 16px/1 var(--fh);font-style:normal;flex:none}
.org b{display:block;font:700 15.5px/1.15 var(--fh);letter-spacing:var(--ht,-.01em)}
.org small{display:block;font-size:12px;opacity:.6;line-height:1.3}
.nv{display:flex;align-items:center;gap:11px;width:100%;padding:9px 10px;border-radius:var(--rs);text-align:left;font-weight:500;opacity:.78;transition:background .15s,opacity .15s}
.nv:hover{opacity:1;background:var(--shov,color-mix(in srgb,currentColor 7%,transparent))}
.nv.on{opacity:1;background:var(--son,color-mix(in srgb,var(--ac) 14%,transparent));color:var(--sonk,inherit)}
.nv em{margin-left:auto;font-style:normal;font-size:11.5px;font-weight:600;min-width:22px;padding:2px 7px;border-radius:999px;background:var(--ac);color:var(--aci);text-align:center}
.nv em.z{display:none}
.sp{flex:1;min-height:12px}
.me{display:flex;align-items:center;gap:10px;padding:10px 8px 2px;border-top:1px solid var(--sline,var(--line));margin-top:8px}
.me i{width:32px;height:32px;border-radius:50%;background:var(--avbg,color-mix(in srgb,var(--ac) 22%,transparent));display:grid;place-items:center;font:600 12px/1 var(--fb);font-style:normal;flex:none}
.me b{display:block;font-size:13.5px;line-height:1.2}.me small{font-size:12px;opacity:.6}
.dev{font-size:11.5px;opacity:.45;padding:8px 8px 0}
.main{display:flex;flex-direction:column;min-width:0;min-height:0}
.top{display:flex;align-items:center;gap:14px;padding:16px 26px;border-bottom:1px solid var(--line);background:var(--topbg,var(--bg))}
.ttl{min-width:0;flex:1}
.ttl h1{margin:0;font:var(--hw,700) 22px/1.15 var(--fh);letter-spacing:var(--ht,-.01em);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ttl p{margin:2px 0 0;font-size:13px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sr{position:relative;width:min(280px,30vw)}
.sr input{width:100%;height:38px;border-radius:var(--rs);border:1px solid var(--line);background:var(--card);padding:0 12px 0 36px;font-size:14px}
.sr input:focus{outline:0;border-color:var(--ac);box-shadow:0 0 0 3px color-mix(in srgb,var(--ac) 18%,transparent)}
.sr svg{position:absolute;left:11px;top:10px;opacity:.5}
.bt{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:38px;padding:0 15px;border-radius:var(--rs);background:var(--ac);color:var(--aci);font-weight:600;font-size:14px;white-space:nowrap;transition:filter .15s,transform .1s}
.bt:hover{filter:brightness(1.07)}.bt:active{transform:scale(.98)}
.bt.g{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1px var(--line2,var(--line))}
.bt.dz{background:color-mix(in srgb,var(--bad) 12%,transparent);color:var(--bad)}
.bt.sm{height:32px;padding:0 11px;font-size:13px}
.bt[disabled]{opacity:.45;pointer-events:none}
.mb{display:none}
#view{flex:1;overflow:auto;padding:22px 26px 40px;min-height:0}
.vh{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:16px}
.ch{display:inline-flex;align-items:center;gap:7px;height:32px;padding:0 12px;border-radius:999px;font-size:13px;font-weight:500;box-shadow:inset 0 0 0 1px var(--line);background:var(--card);white-space:nowrap}
.ch b{font-weight:600;opacity:.55}
.ch.on{background:var(--ink);color:var(--bg);box-shadow:none}.ch.on b{opacity:.7}
.vh .grow{flex:1}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:18px}
.kp{background:var(--card);border-radius:var(--r);padding:14px 16px;box-shadow:var(--csh,0 0 0 1px var(--line))}
.kp span{display:block;font-size:12.5px;color:var(--mut)}
.kp b{display:block;font:var(--hw,700) 24px/1.2 var(--fh);letter-spacing:-.02em;margin-top:4px;white-space:nowrap}
.kp b .num{font:inherit;letter-spacing:inherit}
.kp small{display:block;font-size:12px;color:var(--mut);margin-top:2px}
.kp.ac{background:var(--ac);color:var(--aci)}.kp.ac span,.kp.ac small{color:inherit;opacity:.75}
.tw{background:var(--card);border-radius:var(--r);box-shadow:var(--csh,0 0 0 1px var(--line));overflow:hidden}
table.t{width:100%;border-collapse:collapse}
.t th{text-align:left;font-size:12px;font-weight:600;color:var(--mut);padding:11px 14px;border-bottom:1px solid var(--line);white-space:nowrap;cursor:pointer;user-select:none}
.t th.r,.t td.r{text-align:right}
.t th.s::after{content:" ↓";opacity:.6}.t th.s.up::after{content:" ↑"}
.t td{padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
.t tr:last-child td{border-bottom:0}
.t tbody tr{cursor:pointer;transition:background .12s}
.t tbody tr:hover{background:color-mix(in srgb,var(--ac) 5%,transparent)}
.t tr.fl{animation:fl 1.4s}
@keyframes fl{0%{background:color-mix(in srgb,var(--ac) 22%,transparent)}}
.t td b{font-weight:600}
.t td small{display:block;color:var(--mut);font-size:12.5px}
.num{font-family:var(--fm,var(--fb));font-variant-numeric:tabular-nums;white-space:nowrap}
.pl{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;line-height:1;padding:5px 9px;border-radius:999px;white-space:nowrap;background:color-mix(in srgb,var(--tc) 14%,transparent);color:color-mix(in srgb,var(--tc) 82%,var(--ink))}
.pl::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--tc)}
.pl.ok{--tc:var(--ok)}.pl.warn{--tc:var(--warn)}.pl.bad{--tc:var(--bad)}.pl.info{--tc:var(--info)}.pl.idle{--tc:var(--idle)}.pl.ac{--tc:var(--ac)}
.em{padding:40px 16px;text-align:center;color:var(--mut)}
.bar2{height:6px;border-radius:3px;background:color-mix(in srgb,var(--ink) 8%,transparent);overflow:hidden;min-width:60px}
.bar2 i{display:block;height:100%;background:var(--ac);border-radius:3px}
/* канбан */
.bd{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(212px,1fr);gap:14px;align-items:start;overflow-x:auto;padding-bottom:6px}
.col{background:var(--colbg,color-mix(in srgb,var(--ink) 4%,transparent));border-radius:var(--r);padding:10px;min-height:120px;transition:background .15s}
.col.ov{background:color-mix(in srgb,var(--ac) 12%,transparent)}
.col h3{display:flex;align-items:center;gap:8px;margin:2px 4px 10px;font:600 13.5px/1.2 var(--fb)}
.col h3 em{font-style:normal;font-size:12px;color:var(--mut);margin-left:auto}
.cd{background:var(--card);border-radius:10px;padding:12px;margin-bottom:8px;box-shadow:0 1px 2px rgba(0,0,0,.06),0 0 0 1px var(--line);cursor:grab;font-size:13.5px}
.cd:active{cursor:grabbing}
.cd b{display:block;font-size:14px;line-height:1.3;margin-bottom:3px}
.cd small{display:block;color:var(--mut);font-size:12.5px}
.cd .ft{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px 8px;margin-top:9px}
.cd.dg{opacity:.4}
/* расписание */
.dt{display:flex;gap:6px;margin-bottom:14px;overflow-x:auto;scrollbar-width:none}
.dt::-webkit-scrollbar{display:none}
.dt button{flex:none;padding:8px 13px;border-radius:10px;box-shadow:inset 0 0 0 1px var(--line);background:var(--card);font-size:13px;line-height:1.2;text-align:center}
.dt button small{display:block;font-size:11.5px;color:var(--mut)}
.dt button.on{background:var(--ac);color:var(--aci);box-shadow:none}.dt button.on small{color:inherit;opacity:.75}
.gw{overflow:auto;background:var(--card);border-radius:var(--r);box-shadow:var(--csh,0 0 0 1px var(--line));max-height:calc(100dvh - 250px)}
.gr{display:grid;position:relative;min-width:calc(64px + var(--nr) * 150px)}
.gr .hc{position:sticky;top:0;z-index:3;background:var(--card);padding:10px;border-bottom:1px solid var(--line);font-size:13px;line-height:1.25;min-width:0}
.gr .hc b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.gr .hc small{color:var(--mut);font-size:12px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gr .tc{position:sticky;left:0;z-index:2;background:var(--card);font:500 11.5px/1 var(--fm,var(--fb));color:var(--mut);padding:4px 8px 0 10px;border-right:1px solid var(--line)}
.gr .cl{border-bottom:1px dashed color-mix(in srgb,var(--line) 70%,transparent);border-right:1px solid var(--line);min-height:var(--rh,30px);transition:background .12s}
.gr .cl.h{border-bottom-style:solid}
.gr .cl:hover{background:color-mix(in srgb,var(--ac) 8%,transparent);cursor:copy}
.gr .cl.off{background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--ink) 4%,transparent) 0 4px,transparent 4px 9px);cursor:not-allowed}
.bk{position:absolute;z-index:1;border-radius:8px;padding:5px 8px;font-size:12px;line-height:1.25;overflow:hidden;cursor:pointer;background:color-mix(in srgb,var(--tc,var(--ac)) 16%,var(--card));box-shadow:inset 3px 0 0 var(--tc,var(--ac));transition:transform .12s,box-shadow .12s}
.bk:hover{transform:translateY(-1px);box-shadow:inset 3px 0 0 var(--tc,var(--ac)),0 6px 16px -8px rgba(0,0,0,.4);z-index:2}
.bk b{display:block;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bk small{display:block;opacity:.7;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bk.fl{animation:fl 1.4s}
.now{position:absolute;left:64px;right:0;height:2px;background:var(--bad);z-index:2;pointer-events:none}
.now::before{content:"";position:absolute;left:-5px;top:-4px;width:10px;height:10px;border-radius:50%;background:var(--bad)}
/* карточка справа */
.scrim{position:fixed;inset:0;background:rgba(10,14,22,.36);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
.dr{position:fixed;top:0;right:0;bottom:0;width:min(460px,100%);background:var(--card);z-index:41;transform:translateX(102%);transition:transform .28s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;box-shadow:-20px 0 60px -30px rgba(0,0,0,.5)}
.dr.on{transform:none}
.dr-h{display:flex;align-items:flex-start;gap:12px;padding:20px 22px 14px;border-bottom:1px solid var(--line)}
.dr-h div{flex:1;min-width:0}
.dr-h h2{margin:0;font:var(--hw,700) 19px/1.25 var(--fh);letter-spacing:var(--ht,-.01em)}
.dr-h p{margin:4px 0 0;color:var(--mut);font-size:13px}
.xb{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;flex:none}
.xb:hover{background:color-mix(in srgb,var(--ink) 7%,transparent)}
.dr-b{flex:1;overflow-y:auto;padding:16px 22px}
.fs{display:grid;grid-template-columns:auto 1fr;gap:9px 16px;font-size:14px;margin-bottom:18px}
.fs span{color:var(--mut)}.fs b{font-weight:500;text-align:right;overflow-wrap:anywhere}
.dr-b h4{margin:18px 0 10px;font:600 12px/1 var(--fb);letter-spacing:.08em;text-transform:uppercase;color:var(--mut)}
.tl{list-style:none;margin:0;padding:0;display:grid;gap:12px}
.tl li{display:grid;grid-template-columns:14px 1fr;gap:10px;font-size:13.5px;line-height:1.35}
.tl li::before{content:"";width:9px;height:9px;border-radius:50%;margin-top:4px;background:var(--ac)}
.tl li small{display:block;color:var(--mut);font-size:12px}
.nt{padding:11px 13px;border-radius:10px;background:color-mix(in srgb,var(--warn) 13%,transparent);font-size:13.5px;margin-bottom:14px}
.nt.ok{background:color-mix(in srgb,var(--ok) 12%,transparent)}.nt.bad{background:color-mix(in srgb,var(--bad) 11%,transparent)}
.dr-f{display:flex;flex-wrap:wrap;gap:8px;padding:14px 22px 20px;border-top:1px solid var(--line)}
.dr-f .bt{flex:1 1 auto}
/* формы */
.md{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:16px;opacity:0;pointer-events:none;transition:opacity .18s}
.md.on{opacity:1;pointer-events:auto}
.md form{width:min(480px,100%);max-height:calc(100dvh - 32px);overflow-y:auto;background:var(--card);border-radius:16px;box-shadow:0 40px 100px -30px rgba(0,0,0,.6);transform:translateY(10px);transition:transform .2s}
.md.on form{transform:none}
.md h2{margin:0;font:var(--hw,700) 19px/1.25 var(--fh)}
.md .mh{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 20px 6px}
.md .mbd{padding:8px 20px;display:grid;gap:12px}
.md label{display:grid;gap:5px;font-size:13px;color:var(--mut)}
.md input,.md select,.md textarea{height:40px;border-radius:var(--rs);border:1px solid var(--line);background:var(--bg);padding:0 12px;font-size:14.5px;color:var(--ink);width:100%}
.md textarea{height:auto;min-height:76px;padding:10px 12px;resize:vertical}
.md input:focus,.md select:focus,.md textarea:focus{outline:0;border-color:var(--ac);box-shadow:0 0 0 3px color-mix(in srgb,var(--ac) 18%,transparent)}
.md .two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.md .hint{font-size:12.5px;color:var(--mut)}
.md .err{color:var(--bad);font-size:13px}
.md .mf{display:flex;justify-content:flex-end;gap:8px;padding:12px 20px 20px}
/* журнал и уведомления */
.lg{list-style:none;margin:0;padding:0;background:var(--card);border-radius:var(--r);box-shadow:var(--csh,0 0 0 1px var(--line))}
.lg li{display:grid;grid-template-columns:34px 1fr auto;gap:12px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line);font-size:14px}
.lg li:last-child{border-bottom:0}
.lg li>div{min-width:0}
.lg li i{width:34px;height:34px;border-radius:10px;background:color-mix(in srgb,var(--ac) 12%,transparent);display:grid;place-items:center;font-style:normal;font-size:15px}
.lg li small{color:var(--mut);font-size:12.5px;white-space:nowrap}

.tst{background:var(--ink);color:var(--bg);padding:11px 15px;border-radius:12px;font-size:13.5px;box-shadow:0 14px 34px -14px rgba(0,0,0,.6);animation:tin .25s both;max-width:min(380px,calc(100vw - 32px))}

.ab p{margin:0 0 12px;color:var(--mut);font-size:14px;line-height:1.5}
.ab ul{margin:0;padding-left:18px;display:grid;gap:7px;font-size:14px}
.ab .dv{margin-top:16px;font-size:12.5px;color:var(--mut)}
